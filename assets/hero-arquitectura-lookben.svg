<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="t d">
<title id="t">Composición técnica LOOKBEN: arquitectura, seguridad y evacuación</title>
<desc id="d">Ilustración vectorial original con planta arquitectónica, trazado de evacuación, señalización, cotas y detalles técnicos. Es conceptual y no representa un establecimiento real.</desc>
<defs>
 <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#edf4f8"/></linearGradient>
 <linearGradient id="navy" x2="1" y2="1"><stop stop-color="#352345"/><stop offset="1" stop-color="#244c79"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#20364b" flood-opacity=".13"/></filter>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#9bb4c7" stroke-width="1" opacity=".35"/></pattern>
</defs>
<rect x="24" y="24" width="952" height="672" rx="26" fill="url(#paper)" filter="url(#shadow)"/>
<rect x="42" y="42" width="916" height="636" rx="18" fill="url(#grid)"/>
<g font-family="Arial,sans-serif" fill="#314d66">
 <text x="76" y="88" font-size="18" font-weight="700" letter-spacing="3">LOOKBEN / DOCUMENTACIÓN TÉCNICA</text>
 <text x="76" y="116" font-size="12" letter-spacing="1.5">ARQUITECTURA · PREVENCIÓN · EVACUACIÓN</text>
</g>
