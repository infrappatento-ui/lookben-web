 <path d="M115 226H184V202H304V248H468V190H516" fill="none" stroke="#159c83" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 12"/>
 <path d="M500 174l18 16-18 16" fill="none" stroke="#159c83" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
