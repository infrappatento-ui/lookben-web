  <text x="94" y="112">ÁREA 01</text><text x="270" y="112">ÁREA 02</text><text x="442" y="112">ÁREA 03</text>
  <text x="96" y="326">SERVICIOS</text><text x="280" y="276">CIRCULACIÓN</text><text x="438" y="330">SALIDA</text>
 </g>
