 <path d="M18 158H190" stroke="#ffffff" opacity=".25"/>
 <text x="18" y="178" fill="#c5e7f7" font-family="Arial" font-size="9" letter-spacing="1">ESQUEMA CONCEPTUAL</text>
</g>
<g stroke="#6f91a8" stroke-width="1.5" fill="none"><path d="M78 604H678M78 598v12M678 598v12"/><path d="M694 158V578M688 158h12M688 578h12"/></g>
<g fill="#526f85" font-family="Arial" font-size="11"><text x="345" y="626">PLANTA DE REFERENCIA · TRAZADO ILUSTRATIVO</text><text x="82" y="652">NO CONSTITUYE DOCUMENTACIÓN TÉCNICA DE UN ESTABLECIMIENTO REAL</text></g>
</svg>